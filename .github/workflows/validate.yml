name: Verificar jogo
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verificar sintaxe JavaScript
        run: node --check js/engine.js && node --check js/game.js
      - name: Testar regras do jogo
        run: node --test tests/*.test.cjs
      - name: Verificar arquivos principais
        run: test -s index.html && test -s css/style.css && test -s README.md && test -s assets/characters.svg
