name: Verificar projeto
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar sintaxe JavaScript
        run: node --check js/game.js
      - name: Verificar arquivos principais
        run: test -s index.html && test -s css/style.css && test -s README.md